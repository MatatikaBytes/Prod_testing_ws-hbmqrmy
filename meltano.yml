version: 1
default_environment: dev
project_id: 019f172e-46e4-73b3-9817-5b588696d6a9
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-meltano-cloud
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-meltano-cloud.git@v0.1.6
  - name: tap-surveymonkey
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-surveymonkey.git@v0.1.0
  - name: tap-surveymonkey-privateapp
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-surveymonkey.git@v0.1.0
  - name: tap-aptem
    variant: matatika
    pip_url: git+https://github.com/Matatika/tap-aptem.git@v0.1.0
  loaders:
  - name: target-postgres
    variant: matatika
    pip_url: git+https://github.com/Matatika/pipelinewise-target-postgres.git@v0.2.1
  - name: target-motherduck
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/target-duckdb.git@v0.11.1 duckdb==1.5.4
  - name: target-clickhouse
    variant: meltanolabs
    pip_url: "'target-clickhouse @ git+https://github.com/MeltanoLabs/target-clickhouse.git@v0.4.1'"
  transformers:
  - name: dbt
    variant: dbt-labs
    pip_url: dbt-core~=1.7.0 dbt-postgres~=1.7.0 dbt-snowflake~=1.7.0 dbt-bigquery~=1.7.0 dbt-sqlserver~=1.7.0 certifi==2025.1.31
  files:
  - name: files-dbt
    variant: matatika
    pip_url: git+https://github.com/Matatika/files-dbt@v1.4
  - name: files-melty-ai
    variant: matatika
    pip_url: git+https://github.com/meltano/files-melty-ai.git@v0.1.0
  utilities:
  - name: dbt-duckdb
    variant: jwills
    pip_url: dbt-core~=1.3.0 dbt-duckdb~=1.3.0 git+https://github.com/meltano/dbt-ext.git@main
